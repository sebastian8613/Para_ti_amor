<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Cartas Para Ti ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050002;
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(220, 20, 60, 0.12) 0%, rgba(5, 0, 2, 0.98) 100%);
      pointer-events: none;
    }

    h1 {
      font-family: 'Cinzel', serif;
      color: #ff3366;
      font-size: 2.3rem;
      text-align: center;
      margin-bottom: 10px;
      text-shadow: 0 0 18px rgba(255, 51, 102, 0.6);
      z-index: 1;
    }

    p.subtitle {
      color: #fce8ed;
      font-size: 0.95rem;
      margin-bottom: 45px;
      text-align: center;
      opacity: 0.8;
      z-index: 1;
    }

    .letters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      max-width: 700px;
      width: 100%;
      z-index: 1;
    }

    .letter-card {
      background: rgba(18, 4, 10, 0.88);
      border: 1px solid rgba(230, 0, 57, 0.45);
      border-radius: 16px;
      padding: 35px 25px;
      text-align: center;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.35s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .letter-card:hover {
      transform: translateY(-6px);
      border-color: #ff4d79;
      box-shadow: 0 0 30px rgba(230, 0, 57, 0.6);
      background: rgba(28, 6, 16, 0.95);
    }

    .card-title {
      font-family: 'Cinzel', serif;
      color: #ff4d79;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(255, 77, 121, 0.4);
    }
  </style>
</head>
<body>

  <h1>Nuestra Colección de Cartas ❤️</h1>
  <p class="subtitle">Selecciona una carta para leerla</p>

<div class="letters-grid">

  <!-- Carta 1 -->
  <a href="index1.html" class="letter-card">
    <div class="card-title">PARA MI AMOR ETERNO</div>
  </a>

  <!-- Carta 2 -->
  <a href="index2.html" class="letter-card">
    <div class="card-title">¡TE AMO, TE AMO Y TE AMO!</div>
  </a>

  <!-- Carta 3 -->
  <a href="index3.html" class="letter-card">
    <div class="card-title">SIEMPRE ESTARÉ PARA TI</div>
  </a>

  <!-- Álbum de fotos aparte -->
  <a href="album.html" class="letter-card">
    <div class="card-title">UN VISTAZO A TI</div>
  </a>

</div>

</body>
</html>
